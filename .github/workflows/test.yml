# CI: lint + benchopt design tests + a native end-to-end ingestion/scoring
# run on the Simulated dataset, plus a Docker image build.
name: Test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: |
          pip install -U pip flake8 pytest
          # CPU torch first, so requirements.txt keeps it (no CUDA wheels).
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Lint
        run: flake8 . --max-line-length=79 --exclude=.git,worktrees,__cache__
      - name: benchopt design tests
        run: benchopt test benchmark --skip-install
      - name: Smoke run on Simulated
        run: |
          benchopt run benchmark -d Simulated -s Dummy -s solution/submission.py \
            -r 1 --no-cache --no-plot --no-html --no-display
      - name: Build bundle + end-to-end ingestion + scoring (Simulated)
        run: |
          python tools/create_bundle.py
          python -c "import zipfile; zipfile.ZipFile('bundle.zip').extractall('_codabench/bundle')"
          # No real data in CI: run the phase on the Simulated dataset.
          sed -i 's/- Real/- Simulated/' _codabench/bundle/main_phase/input_data/config.yaml
          python _codabench/bundle/ingestion_program/ingestion.py \
            --submission-dir _codabench/bundle/solution \
            --input-data _codabench/bundle/main_phase/input_data \
            --output-dir _codabench/ingestion
          python _codabench/bundle/scoring_program/scoring.py \
            --prediction-dir _codabench/ingestion \
            --output-dir _codabench/scoring
          python -c "import json; s=json.load(open('_codabench/scoring/scores.json')); \
            keys={'accuracy','accuracy_private','train_time','duration'}; \
            assert keys <= set(s), s; print('scores OK:', s)"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
      - uses: docker/setup-buildx-action@v3
      - name: Build image (CPU torch, build-only)
        uses: docker/build-push-action@v6
        with:
          file: ./tools/Dockerfile
          push: false
          load: false
          build-args: TORCH_CHANNEL=cpu
          tags: codabench-compet-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
