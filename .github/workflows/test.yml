# CI: lint + benchopt design tests + a native end-to-end ingestion/scoring
# run on the Simulated dataset, plus a Docker image build.
name: Test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: |
          pip install -U pip flake8 pytest
          pip install -r requirements.txt
      - name: Lint
        run: flake8 . --max-line-length=79 --exclude=.git,worktrees,__cache__
      - name: benchopt design tests
        run: benchopt test benchmark --skip-install
      - name: Smoke run on Simulated
        run: |
          benchopt run benchmark -d Simulated -s Dummy -s solution/submission.py \
            -r 1 --no-cache --no-plot --no-html --no-display
      - name: Build bundle + end-to-end ingestion + scoring (Simulated)
        run: |
          python tools/create_bundle.py
          python -c "import zipfile; zipfile.ZipFile('bundle.zip').extractall('_bundle')"
          # No real data in CI: run the phase on the Simulated dataset.
          sed -i 's/- Real/- Simulated/' _bundle/main_phase/input_data/config.yaml
          python _bundle/ingestion_program/ingestion.py \
            --submission-dir _bundle/solution \
            --input-data _bundle/main_phase/input_data \
            --benchmark-dir benchmark \
            --output-dir ingestion_res
          python _bundle/scoring_program/scoring.py \
            --prediction-dir ingestion_res \
            --output-dir scoring_res
          python -c "import json; s=json.load(open('scoring_res/scores.json')); \
            keys={'accuracy','accuracy_private','duration'}; \
            assert keys <= set(s), s; print('scores OK:', s)"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (build-only)
        uses: docker/build-push-action@v6
        with:
          file: ./tools/Dockerfile
          push: false
          load: false
          tags: codabench-compet-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
