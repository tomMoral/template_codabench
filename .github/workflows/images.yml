# Build and push the base images codabench-benchopt (CPU) and
# codabench-benchopt-gpu (CUDA) to the GitHub container registry.
name: Base images

on:
  push:
    branches: [main]
    paths: [tools/Dockerfile.base, .github/workflows/images.yml]
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - {name: codabench-benchopt, torch: cpu}
          - {name: codabench-benchopt-gpu, torch: cu126}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          file: ./tools/Dockerfile.base
          push: true
          build-args: TORCH_CHANNEL=${{ matrix.torch }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
